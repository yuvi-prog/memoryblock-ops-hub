<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="title-block">
      <p class="eyebrow">Memory Block &middot; personal tools</p>
      <h1>Ops hub</h1>
      <p>Every system you've built, one launch point.</p>
    </div>
    <div class="top-actions">
      <input id="search" type="text" placeholder="Search..." oninput="render()">
      <button class="btn-primary" onclick="openModal()">+ Add system</button>
      <button class="icon-btn lock-btn" onclick="logout()" title="Lock">&#128274;</button>
    </div>
  </div>

  <div id="content"></div>

</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Add system</h3>
    <div class="field">
      <label>Name</label>
      <input id="f-name" type="text" placeholder="Warehouse inventory">
    </div>
    <div class="field">
      <label>URL</label>
      <input id="f-url" type="text" placeholder="https://...">
    </div>
    <div class="field">
      <label>Category</label>
      <input id="f-category" type="text" placeholder="Memory Block &middot; Australia" list="cat-list">
      <datalist id="cat-list"></datalist>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="live">Live</option>
        <option value="progress">In progress</option>
        <option value="idea">Idea / planned</option>
      </select>
    </div>
    <p class="form-error" id="form-error"></p>
    <div class="modal-actions">
      <div class="left">
        <button onclick="closeModal()">Cancel</button>
        <button id="delete-btn" style="display:none;color:var(--red);" onclick="deleteCurrent()">Delete</button>
      </div>
      <button class="btn-primary" onclick="saveCurrent()">Save</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
