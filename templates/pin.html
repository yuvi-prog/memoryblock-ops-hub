<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#14161a;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:#edeae3;
  height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pin-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
#logo{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.18em;color:#9b7ee8;
  text-transform:uppercase;margin-bottom:9px}
#tagline{font-size:14px;color:#63676f;margin-bottom:40px;letter-spacing:.2px}
#dots{display:flex;gap:18px;margin-bottom:40px;height:16px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#2a2e36;border:1px solid #3a3f49;
  transition:background .15s,transform .15s}
.dot.filled{background:#9b7ee8;border-color:#9b7ee8;transform:scale(1.15)}
#pad{display:grid;grid-template-columns:repeat(3,84px);gap:13px}
.key{width:84px;height:84px;border-radius:50%;background:#1b1e24;
  border:1px solid #2a2e36;color:#edeae3;font-size:23px;font-weight:500;
  cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;
  user-select:none}
.key:hover{background:#22262e;border-color:#3a3f49}
.key:active{background:#372b52;border-color:#9b7ee8;transform:scale(.96)}
.key.del{font-size:16px;color:#63676f}
.key.empty{visibility:hidden;pointer-events:none}
#err{height:19px;font-size:13px;color:#c9584f;text-align:center;margin-top:-20px;margin-bottom:9px;
  opacity:0;transition:opacity .2s}
#err.show{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#dots.shake{animation:shake .35s ease}
</style>
</head>
<body>
<div id="pin-wrap">
  <div id="logo">Memory Block</div>
  <div id="tagline">Ops hub</div>
  <div id="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
  <div id="err">Incorrect PIN</div>
  <div id="pad">
    <div class="key" onclick="press('1')">1</div>
    <div class="key" onclick="press('2')">2</div>
    <div class="key" onclick="press('3')">3</div>
    <div class="key" onclick="press('4')">4</div>
    <div class="key" onclick="press('5')">5</div>
    <div class="key" onclick="press('6')">6</div>
    <div class="key" onclick="press('7')">7</div>
    <div class="key" onclick="press('8')">8</div>
    <div class="key" onclick="press('9')">9</div>
    <div class="key empty"></div>
    <div class="key" onclick="press('0')">0</div>
    <div class="key del" onclick="del()">⌫</div>
  </div>
</div>

<script>
let pin='';
function press(d){
  if(pin.length>=4) return;
  pin+=d;
  updateDots();
  if(pin.length===4) submit();
}
function del(){
  pin=pin.slice(0,-1);
  updateDots();
}
function updateDots(){
  for(let i=0;i<4;i++)
    document.getElementById('d'+i).classList.toggle('filled',i<pin.length);
}
async function submit(){
  const res=await fetch('/api/auth/pin',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin})
  });
  if(res.ok){
    window.location.href='/';
  } else {
    const dots=document.getElementById('dots');
    const err=document.getElementById('err');
    dots.classList.add('shake');
    err.classList.add('show');
    setTimeout(()=>{
      dots.classList.remove('shake');
      err.classList.remove('show');
      pin='';updateDots();
    },600);
  }
}
document.addEventListener('keydown',e=>{
  if(e.key>='0'&&e.key<='9') press(e.key);
  if(e.key==='Backspace') del();
});
</script>
</body>
</html>
